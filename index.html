<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1D1410" />
<meta name="description" content="CRM de Produtos da Firece — gestão de produtos e faturamento" />
<title>CRM de Produtos da Firece</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 560 560'%3E%3Cpath fill='%23E8400D' d='M524 52C514 138 488 190 452 210C432 222 408 228 386 230L250 238C210 243 184 264 172 298L68 494C60 513 46 521 40 515C35 510 35 503 38 494L106 248C112 214 119 194 133 182C154 164 190 150 236 138Z'/%3E%3Cpath fill='%23E8400D' d='M241 398C226 398 222 388 235 383L454 286C469 280 478 289 473 303L453 359C445 382 429 398 406 398Z'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

<div id="app" class="app">

  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar" id="sidebar" aria-label="Menu principal">
    <div class="sidebar__brand">
      <div class="brand">
        <span class="brand__logo"><svg class="brand__mark" viewBox="0 0 560 560" aria-hidden="true"><path d="M524 52 C514 138 488 190 452 210 C432 222 408 228 386 230 L250 238 C210 243 184 264 172 298 L68 494 C60 513 46 521 40 515 C35 510 35 503 38 494 L106 248 C112 214 119 194 133 182 C154 164 190 150 236 138 Z"/><path d="M241 398 C226 398 222 388 235 383 L454 286 C469 280 478 289 473 303 L453 359 C445 382 429 398 406 398 Z"/></svg></span>
        <span class="brand__text">
          <strong>Firece</strong>
          <small>CRM de Produtos</small>
        </span>
      </div>
      <button class="sidebar__close icon-btn" id="sidebarClose" aria-label="Fechar menu">✕</button>
    </div>

    <nav class="nav" id="nav"><!-- montado por app.js --></nav>

    <div class="sidebar__footer">
      <div class="userbox" id="userBox">
        <div class="avatar" id="userAvatar">G</div>
        <div class="userbox__info">
          <strong id="userName">Gestor</strong>
          <small id="userRole">Administrador</small>
        </div>
      </div>
      <select id="userSwitch" class="input input--sm" aria-label="Trocar usuário ativo"></select>
    </div>
  </aside>
  <div class="sidebar__overlay" id="sidebarOverlay" hidden></div>

  <!-- ============ CONTEÚDO ============ -->
  <div class="main">
    <header class="topbar">
      <button class="icon-btn topbar__burger" id="burger" aria-label="Abrir menu">☰</button>
      <div class="topbar__title">
        <h1 id="pageTitle">CRM de Produtos da Firece</h1>
        <p id="pageSubtitle">Gestão de Produtos e Faturamento</p>
      </div>
      <div class="topbar__actions">
        <button class="btn btn--ghost" data-action="new-cadastro">
          <span aria-hidden="true">＋</span> <span class="btn__label">Novo Cadastro</span>
        </button>
        <button class="btn btn--fire" data-action="new-venda">
          <span aria-hidden="true">＋</span> <span class="btn__label">Nova Venda</span>
        </button>
      </div>
    </header>

    <main class="content" id="view" tabindex="-1"><!-- renderizado por app.js --></main>

    <footer class="appfooter">
      <span>CRM de Produtos da Firece · dados armazenados localmente neste navegador</span>
      <span class="appfooter__sep">·</span>
      <button class="linkbtn" data-action="goto-config">⚙️ Configurações</button>
    </footer>
  </div>

  <!-- barra inferior mobile -->
  <nav class="tabbar" aria-label="Atalhos">
    <button class="tabbar__item" data-route="dashboard"><span>📊</span>Dashboard</button>
    <button class="tabbar__item" data-route="funil"><span>🎯</span>Funil</button>
    <button class="tabbar__item tabbar__fab" data-action="new-venda" aria-label="Nova venda"><span>＋</span></button>
    <button class="tabbar__item" data-route="carteira"><span>💼</span>Carteira</button>
    <button class="tabbar__item" data-route="financeiro"><span>💰</span>Financeiro</button>
  </nav>
</div>

<div id="modalRoot"></div>
<div id="toastRoot" class="toasts" aria-live="polite"></div>

<script src="assets/js/util.js"></script>
<script src="assets/js/qrcode.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/metrics.js"></script>
<script src="assets/js/charts.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/forms.js"></script>
<script src="assets/js/views/dashboard.js"></script>
<script src="assets/js/views/cadastros.js"></script>
<script src="assets/js/views/funil.js"></script>
<script src="assets/js/views/produtos.js"></script>
<script src="assets/js/views/links.js"></script>
<script src="assets/js/views/desempenho.js"></script>
<script src="assets/js/views/tarefas.js"></script>
<script src="assets/js/views/carteira.js"></script>
<script src="assets/js/views/financeiro.js"></script>
<script src="assets/js/views/clientes.js"></script>
<script src="assets/js/views/relatorios.js"></script>
<script src="assets/js/views/ranking.js"></script>
<script src="assets/js/views/config.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
