# Publicação do CRM de Produtos da Firece
# O projeto é HTML/CSS/JS puro: não há etapa de build.
[build]
  publish = "."

# Cabeçalhos de segurança. Não bloqueiam o Supabase nem o CDN da
# biblioteca dele — só fecham o que o sistema não usa.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

# O SQL e a documentação não precisam ser servidos pelo site
[[redirects]]
  from = "/supabase/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
